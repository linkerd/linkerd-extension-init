version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # kube and k8s-openapi must move together or the build breaks
      kube:
        patterns:
          - "kube"
          - "kube-*"
          - "k8s-openapi"
      # listed before tokio so tokio-rustls lands here: a dependency
      # joins the first group whose patterns it matches
      tls:
        patterns:
          - "rustls"
          - "rustls-*"
          - "*-rustls"
          - "webpki-roots"
          - "ring"
          - "aws-lc-rs"
          - "openssl"
          - "openssl-*"
          - "native-tls"
          - "*-native-tls"
      tokio:
        patterns:
          - "tokio"
          - "tokio-*"
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "rust"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - ".github/actions/docker-build"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "ci"
